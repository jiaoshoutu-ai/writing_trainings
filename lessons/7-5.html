            margin-bottom: 20px;

            font-weight: 900;
            color: #0f172a;

            align-items: center;
            gap: 12px;
            color: #0f172a;
            margin-bottom: 24px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-note {
            background: #fefce8;
            border: 2px solid #eab308;
            border-radius: 16px;
            padding: 20px;
            margin-top: 24px;
        }

        .video-note p {
            color: #92400e;
            font-size: 14px;
            line-height: 1.8;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-purple {
            background: #a855f7;
            color: white;
            box-shadow: 0 4px 15px rgba(168,85,247,0.4);
        }
        .btn-purple:hover { background: #9333ea; }

            justify-content: center;

            margin: 40px 0;

            border-top: 1px solid #e2e8f0;
