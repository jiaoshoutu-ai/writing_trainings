<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 测试 - 写作训练</title>
    <script src="writing-assistant.browser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .test-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .test-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .status {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .status.success { background: #dcfce7; color: #166534; border: 1px solid #22c55e; }
        .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
        .status.info { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.8;
            color: #334155;
            display: none;
        }
        .result.show { display: block; }
        .config-info {
            background: #fefce8;
            border: 1px solid #facc15;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .config-info strong { color: #92400e; }
        .nav-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .nav-link:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="nav-link">← 返回首页</a>
        <h1>🧪 API 功能测试</h1>

        <div class="config-info" id="config-info">
            <strong>📋 当前配置：</strong> 正在读取...
        </div>

        <!-- 测试 1: callAPI -->
        <div class="test-card">
            <h2>测试 1: callAPI 基础调用</h2>
            <div id="test1-status" class="status info">准备就绪</div>
            <button onclick="test1_callAPI()">运行测试</button>
            <div id="test1-result" class="result"></div>
        </div>

        <!-- 测试 2: chat -->
        <div class="test-card">
            <h2>测试 2: chat 快捷调用</h2>
            <div id="test2-status" class="status info">准备就绪</div>
            <textarea id="test2-input" placeholder="输入你想问 AI 的问题...">请用慢镜头技巧改写这句话：他摔倒了，膝盖破了皮。</textarea>
            <button onclick="test2_chat()">运行测试</button>
            <div id="test2-result" class="result"></div>
        </div>

        <!-- 测试 3: WritingAssistant.evaluateSlowMotion -->
        <div class="test-card">
            <h2>测试 3: WritingAssistant 慢镜头评估</h2>
            <div id="test3-status" class="status info">准备就绪</div>
            <textarea id="test3-input" placeholder="输入你的慢镜头描写...">他摔倒了，膝盖破了皮。</textarea>
            <button onclick="test3_evaluateSlowMotion()">运行测试</button>
            <div id="test3-result" class="result"></div>
        </div>

        <!-- 测试 4: 连接测试 -->
        <div class="test-card">
            <h2>测试 4: API 连接测试</h2>
            <div id="test4-status" class="status info">准备就绪</div>
            <button onclick="test4_connection()">测试连接</button>
            <div id="test4-result" class="result"></div>
        </div>
    </div>

    <script>
        // 显示当前配置
        function showConfig() {
            const configInfo = document.getElementById('config-info');
            try {
                const config = getCurrentConfig();
                if (!config.apiKey) {
                    configInfo.innerHTML = `
                        <strong>⚠️ 未配置 API Key：</strong> 请先访问 <a href="settings.html" style="color: #1d4ed8; text-decoration: underline;">大模型配置页面</a> 设置 API Key
                    `;
                    configInfo.className = 'config-info';
                    configInfo.style.background = '#fee2e2';
                    configInfo.style.borderColor = '#ef4444';
                } else {
                    const maskedKey = config.apiKey ?
                        config.apiKey.substring(0, 8) + '••••' + config.apiKey.substring(config.apiKey.length - 4) :
                        '未设置';
                    configInfo.innerHTML = `
                        <strong>📋 当前配置：</strong><br>
                        Provider: ${config.provider} |
                        Model: ${config.model} |
                        API Key: ${maskedKey} |
                        Base URL: ${config.baseURL}
                    `;
                    configInfo.className = 'config-info';
                    configInfo.style.background = '#fefce8';
                    configInfo.style.borderColor = '#facc15';
                }
            } catch (e) {
                configInfo.innerHTML = `<strong>⚠️ 配置错误：</strong> ${e.message}`;
            }
        }
        showConfig();

        // 设置状态
        function setStatus(testId, message, type) {
            const statusEl = document.getElementById(testId + '-status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        function showResult(testId, content) {
            const resultEl = document.getElementById(testId + '-result');
            resultEl.textContent = content;
            resultEl.classList.add('show');
        }

        // 测试 1: callAPI
        async function test1_callAPI() {
            setStatus('test1', '正在调用 API...', 'info');
            document.getElementById('test1-result').classList.remove('show');

            try {
                const result = await callAPI([
                    { role: 'system', content: '你是一个友好的助手。' },
                    { role: 'user', content: '你好，请用一句话介绍你自己。' }
                ]);
                setStatus('test1', '✅ 调用成功！', 'success');
                showResult('test1', 'API 响应内容：\n' + result.content);
            } catch (error) {
                setStatus('test1', '❌ 调用失败：' + error.message, 'error');
            }
        }

        // 测试 2: chat
        async function test2_chat() {
            const input = document.getElementById('test2-input').value.trim();
            if (!input) {
                alert('请输入问题');
                return;
            }

            setStatus('test2', '正在调用 chat...', 'info');
            document.getElementById('test2-result').classList.remove('show');

            try {
                const result = await chat(input, '你是经验丰富的上海初中语文名师，擅长指导学生写作。');
                setStatus('test2', '✅ 调用成功！', 'success');
                showResult('test2', 'AI 回复：\n' + result);
            } catch (error) {
                setStatus('test2', '❌ 调用失败：' + error.message, 'error');
            }
        }

        // 测试 3: WritingAssistant.evaluateSlowMotion
        async function test3_evaluateSlowMotion() {
            const input = document.getElementById('test3-input').value.trim();
            if (!input) {
                alert('请输入描写内容');
                return;
            }

            setStatus('test3', '正在调用慢镜头评估...', 'info');
            document.getElementById('test3-result').classList.remove('show');

            try {
                const result = await WritingAssistant.evaluateSlowMotion(input);
                setStatus('test3', '✅ 评估成功！', 'success');
                showResult('test3', '评估结果：\n' + result.feedback);
            } catch (error) {
                setStatus('test3', '❌ 评估失败：' + error.message, 'error');
            }
        }

        // 测试 4: 连接测试
        async function test4_connection() {
            setStatus('test4', '正在测试连接...', 'info');
            document.getElementById('test4-result').classList.remove('show');

            try {
                const config = getCurrentConfig();
                const response = await fetch(`${config.baseURL}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${config.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [
                            { role: 'system', content: 'Hello' },
                            { role: 'user', content: 'Say hi' }
                        ],
                        max_tokens: 20
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    setStatus('test4', '✅ 连接成功！', 'success');
                    showResult('test4', '连接测试通过！\n\n响应数据：\n' + JSON.stringify(data, null, 2));
                } else {
                    const error = await response.json();
                    setStatus('test4', '❌ 连接失败：' + (error.error?.message || '未知错误'), 'error');
                }
            } catch (error) {
                setStatus('test4', '❌ 网络错误：' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
